<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#9b72cb"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbbc05"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="480" height="360" rx="12" fill="url(#bg)"/>

  <!-- 渐变小球 -->
  <circle cx="150" cy="170" r="70" fill="url(#ball)" filter="url(#shadow)">
    <animate attributeName="cy" values="170;120;170" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 路径曲线 -->
  <path d="M 60 300 Q 240 180 420 300" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- 多边形与文本 -->
  <polygon points="330,110 370,180 290,180" fill="#34a853" opacity="0.9"/>
  <text x="240" y="70" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif"
        font-size="28" font-weight="bold" fill="#ffffff">SVG 查看器测试</text>
  <text x="240" y="345" text-anchor="middle" font-family="monospace" font-size="13"
        fill="rgba(255,255,255,0.85)">gradient · path · animate · filter</text>
</svg>
